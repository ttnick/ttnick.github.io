---
layout: default
---

<article class="post">
	<header>
		<h1>{{ page.title }}</h1>
		{% if page.tagline %}<p class="tagline">{{ page.tagline }}</p>{% endif %}
	</header>
	<div class="entry">
		{{ content }}
	</div>

	<div class="date">
		Written on {{ page.date | date: "%B %e, %Y" }}
	</div>

	{% include disqus.html %}
</article>
